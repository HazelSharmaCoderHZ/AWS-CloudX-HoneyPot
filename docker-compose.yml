services:
  localstack:
    image: localstack/localstack:3.4
    container_name: haas-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb,lambda,logs,iam
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - "./localstack/init/ready.d:/etc/localstack/init/ready.d"
      - "./Lambda Functions:/opt/lambda-src"
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  demo:
    build:
      context: ./demo
    container_name: haas-demo
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AWS_MODE: local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      HAA_DYNAMODB_TABLE: CowrieLogs
    depends_on:
      localstack:
        condition: service_healthy
      demo:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  localstack_data: